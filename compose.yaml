name: shared-time-scheduler
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD}@db:5432/scheduler?schema=public
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: sh -c "npm ci && npm run db:generate && npm run dev"
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:${POSTGRES_PASSWORD}@db:5432/scheduler
    volumes:
      - .:/app
      - python_venv:/opt/venv
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "uv sync --frozen && uv run alembic upgrade head && uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
  node_modules:
  next_cache:
  python_venv:

